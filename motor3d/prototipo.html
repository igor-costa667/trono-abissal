      fx2.beginPath(); fx2.moveTo(x + Math.cos(a) * R0, y + Math.sin(a) * R0);
      fx2.lineTo(x + Math.cos(a - w) * 1800, y + Math.sin(a - w) * 1800); fx2.lineTo(x + Math.cos(a + w) * 1800, y + Math.sin(a + w) * 1800); fx2.fill();
    }
    estrela(x, y, 120 + 380 * k, 9, `rgba(255,224,110,${1 - k})`, 0.3);
    estrela(x, y, 70 + 200 * k, 9, `rgba(255,255,255,${1 - k})`, 0.6);
    if (u < 0.05) { fx2.fillStyle = 'rgba(255,255,255,0.3)'; fx2.fillRect(0, 0, W, H); }
  }
}

// ---------------- HUD
const $ = (id) => document.getElementById(id);
function mostra(id, a) { $(id).style.opacity = Math.max(0, Math.min(1, a)); }
const env = (t, t0, t1, f = 0.2) => Math.min(suave((t - t0) / f), 1 - suave((t - t1 + f) / f));
function hud(t) {
  mostra('tag', env(t, 0.3, 99, 0.3));
  mostra('banner', env(t, 2.15, 3.55, 0.2));
  const bs = $('banner').querySelector('span'); const kb = suave((t - 2.15) / 0.25); bs.style.transform = `scale(${0.6 + 0.4 * kb})`;
  // dano subindo
  const u = t - (T_HIT + HITSTOP);
  mostra('dano', u > 0 && u < 0.9 ? 1 - suave((u - 0.6) / 0.3) : 0);
  if (u > 0) { const [x, y] = proj(V(1.08, 1.85, 0)); $('dano').style.left = (x - 40) + 'px'; $('dano').style.top = (y - 60 - 160 * u) + 'px'; $('dano').style.transform = `scale(${1 + 0.6 * Math.exp(-10 * u)})`; }
  mostra('painel', env(t, 6.0, 99, 0.25));
  $('painel').style.transform = `translateY(${(1 - suave((t - 6.0) / 0.3)) * -60}px)`;
  const kf = suave((t - 6.35) / 0.6);
  $('bf').style.width = (2 * kf) + '%'; $('nf').textContent = Math.round(2 * kf) + '/100';
  mostra('carimbo', t > 7.05 ? 1 : 0);
  $('carimbo').querySelector('span').style.transform = `rotate(-12deg) scale(${t > 7.05 ? 1 + 1.4 * Math.exp(-14 * (t - 7.05)) : 1})`;
  // legenda (fala do narrador "Força: zero.")
  const L = [[6.1, 'FORÇA:', true], [6.55, 'ZERO.', true]];
  let txt = '';
  for (const [ti, w, forte] of L) if (t >= ti && t < 7.3) txt = `<b>${w}</b>`;
  $('leg').innerHTML = txt; mostra('leg', txt ? 1 : 0);
}

// ---------------- quadro
let ultimo = -1;
window.quadro = (t) => {
  const a = tau(t);
  if (!SOLTA) preparaSolta();
  aplicar(ren, poseEm(a), BASE);
  espadaEm(a);
  let pis = 0;
  for (const tb of [1.2, 4.95, 7.9]) if (a > tb && a < tb + 0.14) pis = Math.sin(Math.PI * (a - tb) / 0.14);
  rosto(ren, exprEm(a), pis, a > 5.15 && a < 6.7 ? 1 : 0, a);
  // boneco balança depois da pancada
  const ub = a - T_HIT;
  boneco.userData.piv.rotation.z = ub > 0 ? -0.32 * Math.exp(-2.4 * ub) * Math.sin(ub * 9) : 0;
  ren.raiz.updateMatrixWorld(true);
  if (t < ultimo) molas(-1);
  molas(t); ultimo = t;
  particulas(a);
  camera(t);
  contorno.render(cena, cam);
  efeitos(t);
  hud(t);
};
